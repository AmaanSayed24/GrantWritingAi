# Base NIH R01 Compliance Rules
# These are the default rules for standard R01 applications (parent announcements).
# FOA-specific overrides go in config/foa-{id}.yaml and take precedence.

page_limits:
  specific_aims: 1
  research_strategy: 12
  biosketch: 5
  biosketch_supplement: 2
  budget_justification: no_limit
  facilities_resources: no_limit
  equipment: no_limit
  data_management_sharing: 2
  authentication_key_biological_resources: 1
  human_subjects_protection: no_limit
  vertebrate_animals: no_limit
  select_agent_research: 1
  multiple_pi_leadership_plan: 3
  consortium_contractual: no_limit
  letters_of_support: no_limit
  resource_sharing_plan: 1

format:
  font_family: "Arial"
  font_size_pt: 11
  margins_inches: 0.5
  line_spacing: "single"
  page_numbering: "bottom-right"
  headers: true
  header_format: "PI Last Name / Project Title / Page X of Y"
  paper_size: "letter"

sections:
  required:
    - specific_aims
    - research_strategy
    - biosketch
    - budget_justification
  research_strategy_subsections:
    - significance
    - innovation
    - approach
  biosketch_format: "2026_common_form"  # or "legacy" for pre-2026
  biosketch_supplement_required: true

budget_rules:
  modular_budget:
    enabled: true
    increment: 25000
    max_direct_costs: 250000
  personnel:
    pi_minimum_effort_pct: 30
    co_investigator_minimum_effort_pct: 10
    max_total_effort_pct: 100
  equipment:
    threshold_usd: 5000
    requires_justification_above: true
  travel:
    foreign_travel_requires_approval: true
    domestic_conference_max_per_year: 2
  consortium:
    f_and_a_on_first_25k_only: true

fonts:
  allowed: ["Arial", "Helvetica", "Georgia", "Palatino Linotype"]
  default: "Arial"
  minimum_size_pt: 11

page_margins:
  top: 0.5
  bottom: 0.5
  left: 0.5
  right: 0.5

validation:
  check_page_limits: true
  check_font: true
  check_margins: true
  check_line_spacing: true
  check_page_numbering: true
  check_headers: true
  check_required_sections: true
  check_budget_rules: true
  check_cross_section_consistency: true
  check_biosketch_format: true
  check_biosketch_page_limit: true

# NIH eRA Commons automated validation checks
era_commons_checks:
  - "Page limits per attachment"
  - "Font size and type"
  - "Margins"
  - "Required attachments present"
  - "Budget modular/non-modular consistency"
  - "Senior/Key Person biosketches"
  - "Data Management and Sharing Plan"
  - "Authentication of Key Biological Resources"
  - "Human Subjects / Vertebrate Animals sections if applicable"